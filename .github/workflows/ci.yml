name: CI

# Quality gate for every push to `main` and every pull request.
# Runs the same commands as `make lint`, `make typecheck`, `make test`
# for the Rust workers + Go gateway (no Python), plus frontend checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-gateway:
    name: Go gateway · vet / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: gateway-coverage
          path: backend/coverage.out
          if-no-files-found: error

  go-contract:
    name: Go gateway · contract (NATS + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      nats:
        image: nats:2.10-alpine
        ports: ["4222:4222"]
        options: --health-cmd "wget -qO- http://localhost:8222/healthz >/dev/null || exit 1"
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sre
          POSTGRES_PASSWORD: sre
          POSTGRES_DB: sre
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sre -d sre"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Contract tests
        working-directory: backend
        env:
          DATABASE_URL_TEST: postgresql://sre:sre@localhost:5432/sre
          NATS_URL_TEST: nats://localhost:4222
        run: go test ./... -run Contract -count=1 -v

  rust-worker:
    name: Rust worker · clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  rust-inference:
    name: Rust inference · clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend/inference
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  rust-proxy:
    name: Rust Pingora proxy · clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend/proxy
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cmake (pingora build dep)
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  ai-gateway:
    name: AI gateway · ruff / pytest / behave
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Test (pytest)
        run: uv run pytest -q --cov=src/ai --cov-report=term

      - name: Test (BDD / behave)
        run: PYTHONPATH=src uv run behave

  frontend:
    name: Frontend · lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check + build (tsc + vite)
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  mobile:
    name: Mobile (React Native) · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

  compose:
    name: Compose file validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config -q
