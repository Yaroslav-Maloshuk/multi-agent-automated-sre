# Automated dependency updates, grouped by ecosystem and kept small on purpose:
# separate PRs per update make regressions easy to bisect.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      python-runtime:
        patterns: ["*"]
        exclude-patterns:
          - "pytest*"
          - "ruff"
          - "mypy"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-runtime:
        patterns: ["*"]
    # typescript-eslint@8 caps typescript at <6.1.0, so a TS 7 major bump can
    # never resolve; keep typescript on compatible majors.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
