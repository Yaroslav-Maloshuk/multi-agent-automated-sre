# ─────────────────────────────────────────────────────────────────────────
# Multi-Agent Automated SRE — single-command stack (Rust + Go + Python).
#
#   docker compose up --build
#
# Brings up: NATS JetStream (messaging/queue), Valkey (reactive store),
# Qdrant (vector memory + snapshots), Postgres (durable state + ROI ledger),
# the Go gateway (REST + WebSocket + SSE + Templ/HTMX dashboard), the Rust
# worker pool (agent graph + Docker sandboxes), the Pingora edge proxy, the
# FastAPI AI gateway (LiteLLM routing, hybrid RAG, ETL, RAGAS), and the
# React command center.
#
# Optional profiles:
#   --profile local-llm    Candle (Rust, Python-free) OpenAI-compatible endpoint
#   --profile llm-routing  LiteLLM proxy on :4000 in front of every provider
#   --profile gpu-llm      vLLM (:8001) + Ray Serve serving the model (:8002) + Ray dashboard (:8265)
# ─────────────────────────────────────────────────────────────────────────

name: auto-sre

services:
  nats:
    image: nats:2.10-alpine
    container_name: auto-sre-nats
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: auto-sre-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: auto-sre-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: auto-sre-postgres
    environment:
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: sre
      POSTGRES_DB: sre
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre -d sre"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    container_name: auto-sre-gateway
    environment:
      APP_ENV: development
      NATS_URL: nats://nats:4222
      VALKEY_URL: valkey://valkey:6379
      POSTGRES_URL: postgresql://sre:sre@postgres:5432/sre
      WS_ORIGINS: http://localhost:3000,http://localhost:5173
      GRAPH_HITL_AUTO_APPROVE: ${GRAPH_HITL_AUTO_APPROVE:-false}
    env_file:
      - path: .env
        required: false
    depends_on:
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["./gateway"]

  worker:
    build:
      context: .
      dockerfile: backend/worker/Dockerfile
    container_name: auto-sre-worker
    environment:
      APP_ENV: development
      NATS_URL: nats://nats:4222
      QDRANT_URL: http://qdrant:6333
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      AI_URL: http://ai:8002/v1
      AI_MODEL: ${AI_MODEL:-local/Qwen/Qwen2.5-3B-Instruct}
      CANDLE_URL: http://inference:11434
      EMBEDDING_URL: ${EMBEDDING_URL:-}
      DOCKER_SANDBOX_IMAGE: auto-sre/sandbox:dev
    env_file:
      - path: .env
        required: false
    depends_on:
      nats:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      gateway:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  inference:
    image: ghcr.io/auto-sre/inference:local
    build:
      context: .
      dockerfile: backend/inference/Dockerfile
    container_name: auto-sre-inference
    profiles: ["local-llm"]
    environment:
      HF_MODEL_ID: ${HF_MODEL_ID:-Qwen/Qwen2.5-1.5B-Instruct}
      PORT: "11434"
      MAX_SEQ_LEN: "2048"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "11434:11434"

  # ── AI / LLM infrastructure ────────────────────────────────────────────
  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    container_name: auto-sre-ai
    environment:
      AI_QDRANT_URL: http://qdrant:6333
      AI_QDRANT_COLLECTION: sre_snapshots
      AI_LANCEDB_PATH: /data/lancedb
      AI_SQLITE_PATH: /data/vectorless.db
      AI_VLLM_URL: http://vllm:8001
      AI_CANDLE_URL: http://inference:11434
    env_file:
      - path: .env
        required: false
    depends_on:
      - qdrant
    volumes:
      - ai-data:/data
    ports:
      - "8002:8002"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: auto-sre-litellm
    profiles: ["llm-routing"]
    command:
      - "--config"
      - "/app/litellm_config.yaml"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./ai/litellm_config.yaml:/app/litellm_config.yaml
    ports:
      - "4000:4000"
    depends_on:
      - inference

  vllm:
    image: vllm/vllm-openai:latest
    container_name: auto-sre-vllm
    profiles: ["gpu-llm"]
    command: ["--model", "${HF_MODEL_ID:-Qwen/Qwen2.5-1.5B-Instruct}", "--port", "8001"]
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ray:
    build:
      context: .
      dockerfile: ai/ray.Dockerfile
    container_name: auto-sre-ray
    profiles: ["gpu-llm"]
    environment:
      HF_MODEL_ID: ${HF_MODEL_ID:-Qwen/Qwen2.5-1.5B-Instruct}
      RAY_TENSOR_PARALLEL: ${RAY_TENSOR_PARALLEL:-1}
    volumes:
      - ${HOME}/.cache/huggingface:/home/ray/.cache/huggingface
    ports:
      - "8002:8001"
      - "8265:8265"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/models', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Pingora edge ────────────────────────────────────────────────────────
  proxy:
    build:
      context: .
      dockerfile: backend/proxy/Dockerfile
    container_name: auto-sre-proxy
    environment:
      GATEWAY_HOST: gateway
      GATEWAY_PORT: "8000"
      AI_HOST: ai
      AI_PORT: "8002"
      CANDLE_HOST: inference
      CANDLE_PORT: "11434"
    depends_on:
      - gateway
      - ai
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: auto-sre-frontend
    env_file:
      - path: .env
        required: false
    depends_on:
      - gateway
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1

volumes:
  nats-data:
  valkey-data:
  qdrant-data:
  pg-data:
  ai-data:
