[project]
name = "auto-sre-ai"
version = "1.0.0"
description = "AI/LLM gateway for the multi-agent SRE workspace: LiteLLM routing, structured calling (Instructor/Outlines/DSPy), hybrid RAG (Qdrant + LanceDB + SQLite PageIndex), ETL (Crawl4AI + DuckDB), RAGAS evals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "duckdb>=1.1",
    "chonkie>=0.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
routing = [
    "litellm>=1.55",
    "instructor>=1.6",
    "outlines>=0.1",
]
dspy = ["dspy-ai>=2.5"]
ml = ["sentence-transformers>=3.3"]
vector = ["qdrant-client>=1.12", "lancedb>=0.17"]
ingest = ["crawl4ai>=0.6"]
eval = ["ragas>=0.2"]
all = [
    "litellm>=1.55",
    "instructor>=1.6",
    "outlines>=0.1",
    "dspy-ai>=2.5",
    "sentence-transformers>=3.3",
    "qdrant-client>=1.12",
    "lancedb>=0.17",
    "crawl4ai>=0.6",
    "ragas>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.9",
    "behave>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.behave]
paths = ["tests/features"]
