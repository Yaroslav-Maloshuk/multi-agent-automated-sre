[project]
name = "auto-sre-workspace"
version = "0.1.0"
description = "Production-grade Multi-Agent Automated SRE Workspace"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "docker>=7.1.0",
    "httpx>=0.27.0",
    "httpx2>=2.9.0",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "numpy>=1.26.0",
    "prisma>=0.12.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
local-llm = ["torch>=2.3.0", "transformers>=4.44.0"]
langfuse = ["langfuse>=2.0.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-watch>=4.2.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "grpcio-tools>=1.66.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires external services (redis, postgres, docker)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "ASYNC", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
# 3.12 target: numpy>=2 ships PEP 695 stubs that cannot be parsed under 3.11.
# The app itself is written for 3.11 and runs on 3.11 in production.
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
