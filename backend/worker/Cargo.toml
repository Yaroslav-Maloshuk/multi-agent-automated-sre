[package]
name = "auto-sre-worker"
version = "1.0.0"
edition = "2021"
description = "Rust/Tokio worker pool of the Multi-Agent Automated SRE engine — stateful async agent graph over NATS JetStream."

[dependencies]
anyhow = "1"
async-nats = "0.38"
async-trait = "0.1"
bollard = "0.18"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
